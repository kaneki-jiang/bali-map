const card = document.getElementById('card');
const cardContent = document.getElementById('cardContent');
function hideCard(){ card.classList.add('hidden'); }
map.on('click', hideCard);

POIS.forEach(p=>{
  const color = COLORS[p.region];
  const big = p.region==='airport';
  const m = L.circleMarker([p.lat,p.lng],{radius:big?9:7,color:'#fff',weight:2,fillColor:color,fillOpacity:1}).addTo(map);
  (window.__poiMarkers = window.__poiMarkers || []).push(m);
  L.marker([p.lat,p.lng],{icon:L.divIcon({className:'poi-label',html:p.name,iconSize:[0,0],iconAnchor:[-12,4]}),interactive:false}).addTo(map);
  m.on('click', (e)=>{
    L.DomEvent.stopPropagation(e);
    cardContent.innerHTML = `
      ${p.img ? `<img src="${p.img}" alt="${p.name}">` : `<div class="noimg">📷 暂无小红书实图（精读笔记未含）</div>`}
      <div class="card-body">
        <h2>${p.name}</h2>
        <span class="tag" style="background:${color}">${REGION_NAME[p.region]}</span>
        <div class="sec play"><b>🎯 玩什么</b>${p.play}</div>
        <div class="sec fit"><b>👤 适合谁</b>${p.fit}</div>
        <div class="sec bad"><b>⚠️ 坏处 / 避雷</b>${p.bad}</div>
        <div class="src">📕 内容来源：小红书精读笔记（${p.src}）</div>
      </div>`;
    card.classList.remove('hidden');
  });
});
</script>
</body>
</html>
